<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fede & Maru — To Do</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --panel: #ffffff;
            --text: #18212b;
            --muted: #74808c;
            --border: #616060;
            --priority: #ffffff;
            --priority-border: #f0c75e;
            --fede: #dceeff;
            --fede-border: #4b9bea;
            --maru: #ffe0e0;
            --maru-border: #ef6a6a;
            --shadow: 0 10px 30px rgba(20, 30, 40, .08);
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .app {
            height: 100vh;
            display: flex;
            overflow: hidden;
            gap: 12px;
        }

        /* ============================================================
         SIDEBAR
         ============================================================ */

        .sidebar {
            width: 260px;
            height: 100vh;
            flex-shrink: 0;
            padding: 24px 18px;
            background: #111820;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .logo {
            font-size: 21px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .badgeBig {
            font-size: 20px;
            padding: 0;
            margin: 0;
            position: relative;
        }

        .subtitle {
            color: #9ca8b4;
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .task-composer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .task-input {
            width: 100%;
            border: 0;
            outline: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            background: #fff;
            color: #18212b;
            -webkit-appearance: none;
        }

        .add-btn {
            border: 0;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            font-weight: 700;
            background: #fff;
            color: #111820;
            transition: .15s;
        }

        .add-btn:hover {
            transform: translateY(-1px);
        }

        .status {
            margin-top: auto;
            font-size: 11px;
            display: flex;
            flex-direction: row;
            gap: 6px;
            color: #9ca8b4;
            line-height: 1.5;
        }

        .list-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .list-nav button {
            width: 100%;
            border: 1px solid #44505c;
            border-radius: 9px;
            padding: 10px 12px;
            background: transparent;
            color: #d7dfe7;
            text-align: left;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .list-nav button.active {
            background: #fff;
            color: #111820;
            border-color: #fff;
        }

        .list-nav button.add-list-btn {
            border-style: dashed;
            color: #aeb9c4;
        }

        /* ============================================================
         CONTENT
         ============================================================ */

        .content {
            flex: 1;
            min-width: 0;
            height: 100vh;
            padding: 30px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .counter {
            color: var(--muted);
            font-size: 13px;
        }

        /* ============================================================
         TASKS
         ============================================================ */

        .tasks {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 1000px;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            min-height: 0;
            flex: 1;
            -webkit-overflow-scrolling: touch;
        }

        .task {
            background: var(--panel);
            border: 2px solid var(--border);
            border-left: 5px solid;
            border-radius: 12px;
            padding: 6px 6px;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(20, 30, 40, .03);
            transition: transform .12s, box-shadow .12s;
        }

        .task:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .task.priority {
            background: var(--priority);
            border-color: var(--priority-border);
            border-left-color: #e2a900;
        }

        .task.done-fede {
            background: var(--fede);
            border-color: var(--fede-border);
            border-left-color: #1877d2;
            opacity: .82;
        }

        .task.done-maru {
            background: var(--maru);
            border-color: var(--maru-border);
            border-left-color: #d83b3b;
            opacity: .82;
        }

        .task.purchase-missing {
            background: #ffe1e1;
            border-color: #ee8c8c;
            border-left-color: #d94a4a;
            opacity: 1;
        }

        .task.purchase-bought {
            background: #e1f3df;
            border-color: #8bc58a;
            border-left-color: #4a9b4a;
            opacity: 1;
        }

        .task.done-generic {
            background: #e1f3df;
            border-color: #8bc58a;
            border-left-color: #4a9b4a;
            opacity: .88;
        }

        .task.other-status {
            background: #e5e7eb;
            border-color: #aeb4bc;
            border-left-color: #747b84;
        }

        .task-main {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .task-title {
            flex: 1;
            font-size: 15px;
            font-weight: 600;
            word-break: break-word;
        }

        .badge {
            flex-shrink: 0;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .4px;
            border-radius: 999px;
            padding: 5px 8px;
            background: rgba(0, 0, 0, .06);
        }

        .empty {
            color: var(--muted);
            padding: 50px 10px;
            text-align: center;
        }

        /* ============================================================
         MODAL
         ============================================================ */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal {
            width: min(420px, 100%);
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .25);
        }

        .modal h2 {
            margin: 0 0 7px;
            font-size: 19px;
        }

        .modal-task {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 20px;
            word-break: break-word;
        }

        .modal-buttons {
            display: grid;
            gap: 6px;
        }

        .modal button {
            border: 1px solid var(--border);
            background: #f8f9fa;
            border-radius: 10px;
            padding: 13px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
        }

        .modal button:hover {
            background: #eef1f4;
        }

        .modal .priority-btn {
            background: #fff5d6;
            border-color: #efca63;
        }

        .modal .fede-btn {
            background: #e2f1ff;
            border-color: #77b4eb;
        }

        .modal .task-input {
            margin-top: 12px;
            border: 1px solid #cbd2d9;
            padding: 13px;
        }

        .modal .add-submit-btn {
            width: 100%;
            margin-top: 10px;
            background: #111820;
            border-color: #111820;
            color: #fff;
        }

        .purchase-group-field {
            margin-top: 14px;
        }

        .purchase-group-field[hidden] {
            display: none;
        }

        .purchase-group-field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
        }

        .purchase-group-field select {
            width: 100%;
            border: 1px solid #cbd2d9;
            border-radius: 10px;
            padding: 12px;
            background: #fff;
            color: var(--text);
            font: inherit;
        }

        .purchase-group-field small {
            display: block;
            margin-top: 6px;
            color: var(--muted);
        }

        .purchase-group {
            position: relative;
            border: 1px solid #d8dde2;
            border-radius: 12px;
            background: #fff;
            overflow: hidden;
        }

        .purchase-group summary {
            padding: 9px 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            list-style-position: inside;
        }

        .purchase-group summary::marker {
            color: #74808c;
        }

        .purchase-group.todo-group > summary {
            padding-top: 6px;
            padding-bottom: 6px;
            background: #e2e5e8;
            color: #29313a;
        }

        .purchase-group.todo-group > summary::marker {
            color: #68727c;
        }

        .purchase-group-items {
            display: block;
            padding: 0 6px 6px;
            height: auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        .purchase-group[open] .purchase-group-items {
            height: auto;
            max-height: 400px;
            overflow-y: auto;
            scrollbar-gutter: stable;
        }

        .purchase-group[open] .purchase-group-items::-webkit-scrollbar {
            width: 10px;
        }

        .purchase-group[open] .purchase-group-items::-webkit-scrollbar-thumb {
            border: 2px solid #fff;
            border-radius: 999px;
            background: #9aa5af;
        }

        .tasks.purchase-page {
            overflow: hidden;
        }

        .purchase-groups-scroll {
            display: flex;
            flex: 1 1 auto;
            flex-direction: column;
            gap: 5px;
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow-y: scroll;
            overflow-x: hidden;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            -webkit-overflow-scrolling: touch;
        }

        .purchase-groups-scroll>.purchase-group {
            flex: 0 0 auto;
        }

        .purchase-group-items>.task {
            margin-bottom: 4px;
        }

        .purchase-group-empty {
            padding: 8px 5px;
            color: var(--muted);
            font-size: 13px;
        }

        .add-group-btn {
            border: 1px solid #cbd2d9;
            border-radius: 9px;
            padding: 9px 12px;
            background: #fff;
            color: var(--text);
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .add-group-btn[hidden] {
            display: none;
        }

        .purchase-group summary {
            padding-right: 160px;
        }

        .purchase-section-badge {
            background: #edf0f2;
            color: #38424c;
            font-size: 9px;
        }

        .purchase-delete-group {
            position: absolute;
            top: 7px;
            right: 8px;
            border: 1px solid #efb0b0;
            border-radius: 7px;
            padding: 5px 8px;
            background: #fff;
            color: #b42323;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .purchase-rename-group {
            position: absolute;
            top: 7px;
            right: 70px;
            border: 1px solid #cbd2d9;
            border-radius: 7px;
            padding: 5px 8px;
            background: #fff;
            color: var(--text);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .modal .edit-title-btn {
            width: 100%;
            margin: 0 0 10px;
            background: #f2f4f6;
            border-color: #cbd2d9;
        }

        .purchase-move-controls {
            display: grid;
            gap: 5px;
            margin-top: 3px;
        }

        .purchase-move-controls label {
            font-size: 13px;
            font-weight: 700;
        }

        .purchase-move-controls select {
            width: 100%;
            border: 1px solid #cbd2d9;
            border-radius: 10px;
            padding: 12px;
            background: #fff;
            color: var(--text);
            font: inherit;
        }

        .modal-buttons[hidden] {
            display: none;
        }

        .modal .purchase-bought-btn {
            background: #e1f3df;
            border-color: #8bc58a;
        }

        .modal .purchase-missing-btn {
            background: #ffe1e1;
            border-color: #ee8c8c;
        }

        .modal .common-done-btn {
            background: #e1f3df;
            border-color: #8bc58a;
        }

        .modal .common-pending-btn {
            background: #fff;
            border-color: #cbd2d9;
        }

        .modal .common-priority-btn {
            background: #fff5d6;
            border-color: #efca63;
        }

        .modal .common-other-btn {
            background: #e5e7eb;
            border-color: #aeb4bc;
        }

        .modal .purchase-normal-btn {
            background: #e1e1e1;
            border-color: #b0b0b0;
        }

        .task.done-fede .task-title,
        .task.done-maru .task-title {
            text-decoration: line-through;
        }

        .tasks-divider {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 8px 0 4px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .tasks-divider::before,
        .tasks-divider::after {
            content: "";
            height: 1px;
            background: var(--border);
            flex: 1;
        }

        .modal .maru-btn {
            background: #ffe7e7;
            border-color: #ef8b8b;
        }

        .modal .btnpendiente {
            background: #929292;
            border-color: #9b9b9b;

        }

        .modal .delete-btn {
            display: block;
            width: 100%;
            margin-top: 9px;
            color: #c62828;
            background: #fff;
            border-color: #efb0b0;
        }

        .close-btn {
            margin-top: 13px;
            width: 100%;
        }

        /* ============================================================
         MOBILE
         ============================================================ */

        @media (max-width: 800px) {

            html,
            body {
                width: 100%;
                height: 100%;
                min-height: 100dvh;
                overflow: hidden;
            }

            .app {
                width: 100%;
                height: 100dvh;
                min-height: 100dvh;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                gap: 0;
            }

            .content {
                order: 1;
                width: 100%;
                height: calc(100dvh - 200px);
                min-height: 0;
                padding: 12px 16px 8px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                flex: none;
            }

            .content-header {
                flex-shrink: 0;
                margin: 0 0 10px 0;
                border-bottom: 3px solid var(--border);
            }

            h1 {
                margin: 0;
                font-size: 22px;
                line-height: 1.2;
            }

            .counter {
                margin-top: 2px;
                margin-bottom: 2px;
                font-size: 12px;
            }

            .tasks {
                width: 100%;
                max-width: none;
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                overflow-x: hidden;
                display: flex;
                flex-direction: column;
                gap: 4px;
                padding-bottom: 4px;
                -webkit-overflow-scrolling: touch;
            }

            .task {
                flex-shrink: 0;
                padding: 6px 6px;
                border-radius: 10px;
            }

            .task-main {
                gap: 5px;
            }

            .task-title {
                font-size: 14px;
                line-height: 1.3;
            }

            .badge {
                font-size: 9px;
                padding: 4px 7px;
            }

            .purchase-group summary {
                font-size: 13px;
            }

            .badgeBig {
                font-size: 18px;
            }

            .empty {
                padding: 30px 10px;
            }

            .sidebar {
                order: 2;
                position: static;
                width: 100%;
                height: 220px;
                min-width: 0;
                min-height: 220px;
                flex-shrink: 0;
                padding: 12px 16px;
                gap: 4px;
            }

            .list-nav {
                flex-direction: row;
                flex-shrink: 0;
                overflow-x: auto;
                padding-bottom: 2px;
                -webkit-overflow-scrolling: touch;
            }

            .list-nav button {
                width: auto;
                background-color: #4b4b4b;
                flex-shrink: 0;
                padding: 9px 12px;
            }

            .task-composer {
                margin-top: 0;
                gap: 4px;
            }

            .task-input {
                height: 60px;
                padding: 18px;
                font-size: 16px;
            }

            .add-btn {
                padding: 18px;
            }

            .status {
                margin-top: 2px;
                font-size: 10px;
                line-height: 1.2;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <aside class="sidebar">


            <div class="task-composer">
                <button id="addBtn" class="add-btn">+ Agregar a Tareas</button>
            </div>

            <div class="status">
                <div id="connectionStatus">Conectando... </div>
                <div>|| Tareas: de 00hs a 01hs se realiza mantenimiento.</div>

            </div>
            <nav id="listNav" class="list-nav" style="margin-top:5px;margin-top: 1px; height: 72px;"
                aria-label="Listas"></nav>
        </aside>

        <main class="content">
            <div class="content-header">
                <div>
                    <h1 id="pageTitle">Tareas ✓ </h1>
                    <div id="counter" class="counter"></div>
                </div>
                <button id="addPurchaseGroupBtn" class="add-group-btn" type="button" hidden>
                    + Agregar sección
                </button>
            </div>

            <section id="tasks" class="tasks"></section>
        </main>
    </div>

    <div id="modalBackdrop" class="modal-backdrop">
        <div class="modal">
            <h2>¿Qué hacemos con este elemento?</h2>
            <div id="modalTask" class="modal-task"></div>
            <button id="editTitleBtn" class="edit-title-btn" type="button">Editar título</button>

            <div id="defaultTaskActions" class="modal-buttons">
                <button id="priorityBtn" class="priority-btn"></button>
                <button id="fedeBtn" class="fede-btn">La realizó Fede</button>
                <button id="maruBtn" class="maru-btn">La realizó Maru</button>
                <button id="uncompleteBtn" class="btnpendiente">Marcar como pendiente</button>
                <button id="diaria">Marcar como diaria</button>
            </div>

            <div id="commonTaskActions" class="modal-buttons" hidden>
                <button id="commonDoneBtn" class="common-done-btn" type="button">Ya hecha</button>
                <button id="commonPendingBtn" class="common-pending-btn" type="button">Pendiente</button>
                <button id="commonPriorityBtn" class="common-priority-btn" type="button">Prioridad</button>
                <button id="commonOtherBtn" class="common-other-btn" type="button">Otro</button>
            </div>

            <div id="purchaseTaskActions" class="modal-buttons" hidden>

                <button id="markMissingBtn" class="purchase-missing-btn" type="button">
                    Marcar faltante
                </button>
                <button id="markNormalBtn" class="purchase-normal-btn" type="button">
                    Marcar comprado
                </button>
                <div class="purchase-move-controls">
                    <label for="purchaseMoveSelect">Mover a sección</label>
                    <select id="purchaseMoveSelect"></select>
                    <button id="movePurchaseBtn" type="button">Mover elemento</button>
                </div>
            </div>

            <button id="deleteBtn" class="delete-btn" type="button">Eliminar elemento</button>

            <button id="closeBtn" class="close-btn">Cerrar</button>
        </div>
    </div>

    <div id="addTaskBackdrop" class="modal-backdrop">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
            <h2 id="addModalTitle">Agregar elemento a Tareas</h2>
            <input id="taskInput" class="task-input" type="text" maxlength="200" placeholder="Escribí el elemento..."
                autocomplete="off" />
            <div id="purchaseGroupField" class="purchase-group-field" hidden>
                <label for="purchaseGroupSelect">¿A qué sección de Compras lo agregamos?</label>
                <select id="purchaseGroupSelect"></select>
                <small>También aparecerá siempre en TODO.</small>
            </div>
            <button id="modalAddBtn" class="add-submit-btn" style="margin-right: 8px; padding:20px"
                type="button">Agregar</button>
            <button id="closeAddModalBtn" class="close-btn" style="color: #030303;background-color:#f44336"
                type="button">Cancelar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getAuth,
            signInAnonymously,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        import {
            getFirestore,
            collection,
            addDoc,
            updateDoc,
            deleteDoc,
            doc,
            query,
            orderBy,
            onSnapshot,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHGZQycg39iiG0pe83uOIKFe4SdWiJsdk",
            authDomain: "todolist-42ba3.firebaseapp.com",
            databaseURL: "https://todolist-42ba3-default-rtdb.firebaseio.com",
            projectId: "todolist-42ba3",
            storageBucket: "todolist-42ba3.firebasestorage.app",
            messagingSenderId: "530049953408",
            appId: "1:530049953408:web:37aa3d609c3502a4948065"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const tasksRef = collection(db, "tasks");
        const listsRef = collection(db, "taskLists");
        const PURCHASE_GROUP_PREFIX = "__SECCION_COMPRAS__:";

        const defaultPageLabels = new Map([
            ["✅Tareas", "Tareas"],
            ["🛒Compras", "Compras"],
            ["📋Listas", "Listas"],
            ["💸Grandes", "Grandes"],
            ["👶🏻Joan", "Joan"],
            ["⛰️Viajes", "Viajes"],
            ["➕Otros", "Otros"]
        ]);
        const canonicalPageName = name => defaultPageLabels.get(name) || name;

        let tasks = [];
        let listNames = ["✅Tareas", "🛒Compras", "📋Listas", "💸Grandes", "👶🏻Joan", "⛰️Viajes", "➕Otros"];
        let purchaseGroups = [];
        const expandedPurchaseGroups = new Set();
        let activeList = "Tareas";
        let selectedTask = null;

        function getArgentinaDateParts() {
            const parts = new Intl.DateTimeFormat("en-US", {
                timeZone: "America/Argentina/Buenos_Aires",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                hourCycle: "h23"
            }).formatToParts(new Date());

            const get = type => parts.find(p => p.type === type)?.value;

            return {
                year: Number(get("year")),
                month: Number(get("month")),
                day: Number(get("day")),
                hour: Number(get("hour"))
            };
        }

        function argentinaDateKey() {
            const d = getArgentinaDateParts();
            return `${d.year}-${String(d.month).padStart(2, "0")}-${String(d.day).padStart(2, "0")}`;
        }

        function sortTasks(list) {
            return [...list].sort((a, b) => {
                const aDone = Boolean(a.completedBy) || a.estadoActividad === "hecha";
                const bDone = Boolean(b.completedBy) || b.estadoActividad === "hecha";

                if (aDone !== bDone) {
                    return aDone ? 1 : -1;
                }

                if (Boolean(a.priority) !== Boolean(b.priority)) {
                    return a.priority ? -1 : 1;
                }

                const aTime = a.createdAt?.seconds || 0;
                const bTime = b.createdAt?.seconds || 0;

                return bTime - aTime;
            });
        }

        function purchaseStatus(task) {
            if (task.estadoCompra === "faltante") return "missing";
            if (task.estadoCompra === "comprado" || (!task.estadoCompra && task.completedBy)) {
                return "bought";
            }
            return "pending";
        }

        function isPurchasePage() {
            return activeList === "Compras" || activeList === "Listas";
        }

        function sortPurchaseTasks(list) {
            const statusOrder = { missing: 0, pending: 1, bought: 2 };

            return [...list].sort((a, b) => {
                const statusDiff = statusOrder[purchaseStatus(a)] - statusOrder[purchaseStatus(b)];
                if (statusDiff !== 0) return statusDiff;
                return String(a.title || "").localeCompare(String(b.title || ""), "es", {
                    sensitivity: "base"
                });
            });
        }

        function sortAllPurchaseTasks(list) {
            const statusOrder = { missing: 0, pending: 1, bought: 2 };

            return [...list].sort((a, b) => {
                const aGroup = String(a.grupoCompra || "").trim();
                const bGroup = String(b.grupoCompra || "").trim();
                const groupDiff = aGroup.localeCompare(bGroup, "es", {
                    sensitivity: "base"
                });
                if (groupDiff !== 0) {
                    if (!aGroup) return 1;
                    if (!bGroup) return -1;
                    return groupDiff;
                }

                const statusDiff = statusOrder[purchaseStatus(a)] - statusOrder[purchaseStatus(b)];
                if (statusDiff !== 0) return statusDiff;
                return String(a.title || "").localeCompare(String(b.title || ""), "es", {
                    sensitivity: "base"
                });
            });
        }

        function isPurchaseGroupRecord(task) {
            return task.esSeccionCompra === true ||
                task.tipoDeActividad === "__purchaseGroups" ||
                (task.tipoDeActividad === "Compras" &&
                    typeof task.title === "string" &&
                    task.title.startsWith(PURCHASE_GROUP_PREFIX));
        }

        function purchaseGroupRecordName(task) {
            if (task.title?.startsWith(PURCHASE_GROUP_PREFIX)) {
                return task.title.slice(PURCHASE_GROUP_PREFIX.length).trim().toUpperCase();
            }
            return String(task.name || task.title || "").trim().toUpperCase();
        }

        function render() {
            const isPurchaseView = isPurchasePage();
            const taskListName = isPurchaseView ? "Compras" : activeList;
            const pageTasks = tasks.filter(
                task =>
                    (task.tipoDeActividad || "Tareas") === taskListName &&
                    !(isPurchaseView && isPurchaseGroupRecord(task)) &&
                    (activeList !== "Compras" || purchaseStatus(task) === "missing")
            );
            const sorted = isPurchaseView
                ? sortAllPurchaseTasks(pageTasks)
                : sortTasks(pageTasks);
            const pendingCount = activeList === "Compras"
                ? sorted.length
                : activeList === "Listas"
                ? sorted.filter(task => purchaseStatus(task) !== "bought").length
                : sorted.filter(task => !task.completedBy && task.estadoActividad !== "hecha").length;

            counterEl.textContent = `${pendingCount} elementos por hacer`;
            tasksEl.innerHTML = "";
            tasksEl.classList.toggle("purchase-page", isPurchaseView);
            pageTitle.textContent = `${activeList} ✓ `;
            addBtn.textContent = `+ Agregar a ${activeList}`;
            addModalTitle.textContent = `Agregar elemento a ${activeList}`;
            addPurchaseGroupBtn.hidden = activeList !== "Listas";
            purchaseGroupField.hidden = !isPurchaseView;
            renderPurchaseGroupOptions();

            if (activeList === "Compras") {
                if (!sorted.length) {
                    tasksEl.innerHTML = `
                        <div class="empty">No hay compras faltantes.</div>
                    `;
                    return;
                }

                appendTaskCards(tasksEl, sorted, true);
                return;
            }

            if (activeList === "Listas") {
                renderPurchaseGroups(sorted);
                return;
            }

            if (!sorted.length) {
                tasksEl.innerHTML = `
        <div class="empty">
            Esta lista está vacía. Agregá el primer elemento.
        </div>
    `;



                return;
            }

            appendTaskCards(tasksEl, sorted);
        }

        function createTaskElement(task, showPurchaseGroup = false) {
            const element = document.createElement("article");
            element.className = "task";

            if (isPurchasePage()) {
                element.classList.add(`purchase-${purchaseStatus(task)}`);
            } else {
                if (task.estadoActividad === "otro") {
                    element.classList.add("other-status");
                } else if (task.estadoActividad === "hecha" || task.completedBy === "hecha") {
                    element.classList.add("done-generic");
                }

                if (task.priority && !task.completedBy) {
                    element.classList.add("priority");
                }

                if (task.completedBy === "fede") {
                    element.classList.add("done-fede");
                }

                if (task.completedBy === "maru") {
                    element.classList.add("done-maru");
                }
            }

            let badge = "";
            let daily = "";
            let priority = "";
            let pending = "";

            if (task.diaria) {
                daily = `<span class="badge">DIARIA</span>`;
            }

            if (activeList !== "Tareas" && !isPurchasePage() && task.estadoActividad) {
                const commonLabels = {
                    hecha: "YA HECHA",
                    pendiente: "PENDIENTE",
                    prioridad: "PRIORIDAD",
                    otro: "OTRO"
                };
                badge = `<span class="badge">${commonLabels[task.estadoActividad] || ""}</span>`;
            } else if (isPurchasePage() && purchaseStatus(task) !== "pending") {
                badge = `<span class="badge">${purchaseStatus(task) === "bought" ? "COMPRADO" : "FALTANTE"}</span>`;
            } else if (task.completedBy === "fede") {
                badge = `<span class="badge">Fede ✓</span>`;
            } else if (task.completedBy === "maru") {
                badge = `<span class="badge">Maru ✓</span>`;
            }

            if (
                !task.completedBy &&
                !(isPurchasePage() && purchaseStatus(task) === "bought") &&
                !(activeList !== "Tareas" && !isPurchasePage() && task.estadoActividad && task.estadoActividad !== "pendiente")
            ) {
                pending = `<span class="pending-icon">🔴</span>`;
            }

            if (task.priority && !isPurchasePage()) {
                priority = `<span class="badgeBig">‼️</span>`;
            }

            element.innerHTML = `
                <div class="task-main">
                    <div class="task-title">
                        ${pending}
                        <span class="task-text"></span>
                    </div>
                    ${daily}
                    ${badge}
                    ${priority}
                </div>
            `;

            element.querySelector(".task-text").textContent = task.title;

            if (isPurchasePage() && showPurchaseGroup) {
                const sectionBadge = document.createElement("span");
                sectionBadge.className = "badge purchase-section-badge";
                sectionBadge.textContent = String(task.grupoCompra || "SIN SECCIÓN").trim();
                element.querySelector(".task-main").appendChild(sectionBadge);
            }

            element.addEventListener("click", () => openModal(task));
            return element;
        }

        function appendTaskCards(container, taskList, showPurchaseGroup = false) {
            let previousDone = false;

            for (const task of taskList) {
                const isDone = Boolean(task.completedBy) || task.estadoActividad === "hecha";

                if (!isPurchasePage() && isDone && !previousDone) {
                    const divider = document.createElement("div");
                    divider.className = "tasks-divider";
                    divider.textContent = "HECHAS";
                    container.appendChild(divider);
                }

                previousDone = isDone;
                container.appendChild(createTaskElement(task, showPurchaseGroup));
            }
        }

        function renderPurchaseGroups(purchaseTasks) {
            const groupsContainer = document.createElement("div");
            groupsContainer.className = "purchase-groups-scroll";

            const sortedGroups = [...purchaseGroups].sort((a, b) =>
                a.localeCompare(b, "es", { sensitivity: "base" })
            );
            const groupNames = ["TODO", ...sortedGroups];

            for (const groupName of groupNames) {
                const groupTasks = groupName === "TODO"
                    ? purchaseTasks
                    : purchaseTasks.filter(
                        task => String(task.grupoCompra || "").trim().toUpperCase() === groupName
                    );
                const sortedGroupTasks = groupName === "TODO"
                    ? sortAllPurchaseTasks(groupTasks)
                    : sortPurchaseTasks(groupTasks);

                const details = document.createElement("details");
                details.className = "purchase-group";
                if (groupName === "TODO") {
                    details.classList.add("todo-group");
                }
                details.open = expandedPurchaseGroups.has(groupName);
                details.addEventListener("toggle", () => {
                    if (details.open) {
                        expandedPurchaseGroups.add(groupName);
                    } else {
                        expandedPurchaseGroups.delete(groupName);
                    }
                });

                const summary = document.createElement("summary");
                const missingCount = sortedGroupTasks.filter(
                    task => purchaseStatus(task) === "missing"
                ).length;
                summary.textContent = `${groupName} (${missingCount})`;
                details.appendChild(summary);

                if (groupName !== "TODO") {
                    const renameGroupBtn = document.createElement("button");
                    renameGroupBtn.type = "button";
                    renameGroupBtn.className = "purchase-rename-group";
                    renameGroupBtn.textContent = "Renombrar";
                    renameGroupBtn.addEventListener("click", event => {
                        event.preventDefault();
                        event.stopPropagation();
                        renamePurchaseGroup(groupName);
                    });
                    details.appendChild(renameGroupBtn);

                    const deleteGroupBtn = document.createElement("button");
                    deleteGroupBtn.type = "button";
                    deleteGroupBtn.className = "purchase-delete-group";
                    deleteGroupBtn.textContent = "Borrar";
                    deleteGroupBtn.addEventListener("click", event => {
                        event.preventDefault();
                        event.stopPropagation();
                        deletePurchaseGroup(groupName);
                    });
                    details.appendChild(deleteGroupBtn);
                }

                const items = document.createElement("div");
                items.className = "purchase-group-items";

                if (sortedGroupTasks.length) {
                    appendTaskCards(items, sortedGroupTasks, groupName === "TODO");
                } else {
                    const empty = document.createElement("div");
                    empty.className = "purchase-group-empty";
                    empty.textContent = "No hay elementos en esta sección.";
                    items.appendChild(empty);
                }

                details.appendChild(items);
                groupsContainer.appendChild(details);
            }

            tasksEl.appendChild(groupsContainer);
        }

        function renderPurchaseGroupOptions() {
            const selectedGroup = purchaseGroupSelect.value;
            purchaseGroupSelect.innerHTML = "";

            const onlyTodoOption = document.createElement("option");
            onlyTodoOption.value = "";
            onlyTodoOption.textContent = "Solo TODO";
            purchaseGroupSelect.appendChild(onlyTodoOption);

            for (const groupName of [...purchaseGroups].sort((a, b) =>
                a.localeCompare(b, "es", { sensitivity: "base" })
            )) {
                const option = document.createElement("option");
                option.value = groupName;
                option.textContent = groupName;
                purchaseGroupSelect.appendChild(option);
            }

            if (purchaseGroups.includes(selectedGroup)) {
                purchaseGroupSelect.value = selectedGroup;
            }
        }

        function renderPurchaseMoveOptions(currentGroup) {
            purchaseMoveSelect.innerHTML = "";

            const todoOption = document.createElement("option");
            todoOption.value = "";
            todoOption.textContent = "TODO (sin sección)";
            purchaseMoveSelect.appendChild(todoOption);

            const sortedGroups = [...purchaseGroups].sort((a, b) =>
                a.localeCompare(b, "es", { sensitivity: "base" })
            );

            for (const groupName of sortedGroups) {
                const option = document.createElement("option");
                option.value = groupName;
                option.textContent = groupName;
                purchaseMoveSelect.appendChild(option);
            }

            purchaseMoveSelect.value = currentGroup || "";
        }

        function openModal(task) {
            selectedTask = task;
            modalTask.textContent = task.title;
            const isPurchase = canonicalPageName(activeList) === "Compras" ||
                task.tipoDeActividad === "Compras";
            const isTaskPage = !isPurchase && canonicalPageName(activeList) === "Tareas";
            const isCommonPage = !isPurchase && !isTaskPage;
            const isPending = task.completedAt == null && task.completedBy == null;
            const isDaily = task.diaria ||
                task.type === "daily" ||
                task.type === "daily-template";

            defaultTaskActions.hidden = !isTaskPage;
            defaultTaskActions.style.display = isTaskPage ? "grid" : "none";
            commonTaskActions.hidden = !isCommonPage;
            commonTaskActions.style.display = isCommonPage ? "grid" : "none";
            purchaseTaskActions.hidden = !isPurchase;
            purchaseTaskActions.style.display = isPurchase ? "grid" : "none";
            deleteBtn.style.display = "block";
            uncompleteBtn.style.display = isPending ? "none" : "block";
            if (isPurchase) {
                renderPurchaseMoveOptions(task.grupoCompra);
            }

            priorityBtn.textContent = task.priority
                ? "Quitar prioridad"
                : "Marcar como prioridad";

            diaria.style.display = isTaskPage ? "block" : "none";
            diaria.textContent = isDaily ? "Quitar de tareas diarias" : "Marcar como diaria";
            priorityBtn.style.display = isTaskPage && !isDaily ? "block" : "none";

            modalBackdrop.classList.add("open");
        }

        function closeModal() {
            selectedTask = null;
            modalBackdrop.classList.remove("open");
        }

        function renderListNav() {
            listNav.innerHTML = "";

            const appendNavButton = (name, pageName, className = "") => {
                const button = document.createElement("button");
                button.type = "button";
                button.textContent = name;
                if (className) button.className = className;
                button.classList.toggle("active", pageName === activeList);
                button.setAttribute("aria-current", pageName === activeList ? "page" : "false");
                button.style.cssText += "width: 92px; padding:2px; text-align: center; justify-content: center;item-align: center; flex-shrink: 0;";
                button.addEventListener("click", () => {
                    activeList = pageName;
                    renderListNav();
                    render();
                });
                listNav.appendChild(button);
            };

            for (const name of listNames) {
                const pageName = canonicalPageName(name);
                appendNavButton(name, pageName);
            }

            const addListButton = document.createElement("button");
            addListButton.type = "button";
            addListButton.className = "add-list-btn";
            addListButton.textContent = "+ Nueva lista";
            addListButton.addEventListener("click", createList);
            listNav.appendChild(addListButton);
        }

        function openAddTaskModal() {
            addTaskBackdrop.classList.add("open");
            taskInput.value = "";
            renderPurchaseGroupOptions();
            taskInput.focus();
        }

        function closeAddTaskModal() {
            addTaskBackdrop.classList.remove("open");
        }

        async function createPurchaseGroup() {
            const name = prompt("Nombre de la sección de Compras:")?.trim().toUpperCase();
            if (!name) return;

            if (name.length > 40) {
                alert("El nombre de la sección no puede superar los 40 caracteres.");
                return;
            }

            if (name === "TODO" || name === "FALTANTE") {
                alert("TODO y FALTANTE están reservados para las listas automáticas de Compras.");
                return;
            }

            const existing = purchaseGroups.find(
                group => group.toUpperCase() === name
            );

            if (existing) {
                expandedPurchaseGroups.add(existing);
                render();
                return;
            }

            try {
                expandedPurchaseGroups.add(name);
                await addDoc(tasksRef, {
                    title: `${PURCHASE_GROUP_PREFIX}${name}`,
                    tipoDeActividad: "Compras",
                    type: "normal",
                    priority: false,
                    completedBy: null,
                    diaria: false,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });
            } catch (error) {
                expandedPurchaseGroups.delete(name);
                console.error(error);
                alert(`No se pudo crear la sección (${error.code || error.message}).`);
            }
        }

        async function deletePurchaseGroup(groupName) {
            const ok = confirm(
                `¿Borrar la sección "${groupName}"? Sus elementos seguirán en TODO.`
            );
            if (!ok) return;

            const itemsToMove = tasks.filter(task =>
                task.tipoDeActividad === "Compras" &&
                !isPurchaseGroupRecord(task) &&
                String(task.grupoCompra || "").trim().toUpperCase() === groupName
            );
            const sectionRecords = tasks.filter(task =>
                isPurchaseGroupRecord(task) && purchaseGroupRecordName(task) === groupName
            );

            try {
                await Promise.all(itemsToMove.map(task =>
                    updateDoc(doc(db, "tasks", task.id), {
                        grupoCompra: null,
                        updatedAt: serverTimestamp()
                    })
                ));

                await Promise.all(sectionRecords.map(task =>
                    deleteDoc(doc(db, "tasks", task.id))
                ));

                expandedPurchaseGroups.delete(groupName);
            } catch (error) {
                console.error(error);
                alert(`No se pudo borrar la sección (${error.code || error.message}).`);
            }
        }

        async function renamePurchaseGroup(oldName) {
            const newName = prompt(`Nuevo nombre para "${oldName}":`, oldName)
                ?.trim()
                .toUpperCase();
            if (!newName || newName === oldName) return;

            if (newName.length > 40) {
                alert("El nombre de la sección no puede superar los 40 caracteres.");
                return;
            }

            if (newName === "TODO" || newName === "FALTANTE") {
                alert("TODO y FALTANTE están reservados para las listas automáticas de Compras.");
                return;
            }

            if (purchaseGroups.some(group => group !== oldName && group.toUpperCase() === newName)) {
                alert("Ya existe una sección con ese nombre.");
                return;
            }

            const itemsToRename = tasks.filter(task =>
                task.tipoDeActividad === "Compras" &&
                !isPurchaseGroupRecord(task) &&
                String(task.grupoCompra || "").trim().toUpperCase() === oldName
            );
            const sectionRecords = tasks.filter(task =>
                isPurchaseGroupRecord(task) && purchaseGroupRecordName(task) === oldName
            );

            try {
                await Promise.all([
                    ...itemsToRename.map(task =>
                        updateDoc(doc(db, "tasks", task.id), {
                            grupoCompra: newName,
                            updatedAt: serverTimestamp()
                        })
                    ),
                    ...sectionRecords.map(task =>
                        updateDoc(doc(db, "tasks", task.id), {
                            title: task.title?.startsWith(PURCHASE_GROUP_PREFIX)
                                ? `${PURCHASE_GROUP_PREFIX}${newName}`
                                : newName,
                            ...(task.name ? { name: newName } : {}),
                            updatedAt: serverTimestamp()
                        })
                    )
                ]);

                if (expandedPurchaseGroups.delete(oldName)) {
                    expandedPurchaseGroups.add(newName);
                }
            } catch (error) {
                console.error(error);
                alert(`No se pudo renombrar la sección (${error.code || error.message}).`);
            }
        }

        async function editTaskTitle() {
            if (!selectedTask) return;

            const newTitle = prompt("Editar título:", selectedTask.title)?.trim();
            if (!newTitle || newTitle === selectedTask.title) return;

            if (newTitle.length > 200) {
                alert("El título no puede superar los 200 caracteres.");
                return;
            }

            try {
                await updateDoc(doc(db, "tasks", selectedTask.id), {
                    title: newTitle,
                    updatedAt: serverTimestamp()
                });
                closeModal();
            } catch (error) {
                console.error(error);
                alert(`No se pudo editar el título (${error.code || error.message}).`);
            }
        }

        async function createList() {
            const name = prompt("Nombre de la nueva lista (por ejemplo, Viajes):")?.trim();

            if (!name) return;

            if (name.length > 40) {
                alert("El nombre de la lista no puede superar los 40 caracteres.");
                return;
            }

            const existing = listNames.find(
                item => canonicalPageName(item).toLocaleLowerCase() === name.toLocaleLowerCase()
            );

            if (existing) {
                activeList = canonicalPageName(existing);
                renderListNav();
                render();
                return;
            }

            try {
                await addDoc(listsRef, {
                    name,
                    createdAt: serverTimestamp()
                });

                activeList = name;
            } catch (error) {
                console.error(error);
                alert("No se pudo crear la lista. Revisá la conexión.");
            }
        }

        closeBtn.addEventListener("click", closeModal);
        editTitleBtn.addEventListener("click", editTaskTitle);

        modalBackdrop.addEventListener("click", event => {
            if (event.target === modalBackdrop) {
                closeModal();
            }
        });

        addBtn.addEventListener("click", openAddTaskModal);
        addPurchaseGroupBtn.addEventListener("click", createPurchaseGroup);
        modalAddBtn.addEventListener("click", addTask);
        closeAddModalBtn.addEventListener("click", closeAddTaskModal);

        async function updatePurchaseStatus(status) {
            if (!selectedTask || !isPurchasePage()) return;

            await updateDoc(doc(db, "tasks", selectedTask.id), {
                estadoCompra: status,
                completedBy: null,
                completedAt: null,
                updatedAt: serverTimestamp()
            });

            closeModal();
        }
 
        markMissingBtn.addEventListener("click", () => updatePurchaseStatus("faltante"));
        markNormalBtn.addEventListener("click", () => updatePurchaseStatus("pending"));

        async function updateCommonStatus(status) {
            if (!selectedTask) return;
            if (canonicalPageName(activeList) === "Tareas" || isPurchasePage()) return;

            const updates = {
                estadoActividad: status,
                priority: status === "prioridad",
                completedBy: null,
                completedAt: null,
                updatedAt: serverTimestamp()
            };

            await updateDoc(doc(db, "tasks", selectedTask.id), updates);
            closeModal();
        }

        commonDoneBtn.addEventListener("click", () => updateCommonStatus("hecha"));
        commonPendingBtn.addEventListener("click", () => updateCommonStatus("pendiente"));
        commonPriorityBtn.addEventListener("click", () => updateCommonStatus("prioridad"));
        commonOtherBtn.addEventListener("click", () => updateCommonStatus("otro"));

        movePurchaseBtn.addEventListener("click", async () => {
            if (!selectedTask || !isPurchasePage()) return;

            await updateDoc(doc(db, "tasks", selectedTask.id), {
                grupoCompra: purchaseMoveSelect.value || null,
                updatedAt: serverTimestamp()
            });

            closeModal();
        });

        addTaskBackdrop.addEventListener("click", event => {
            if (event.target === addTaskBackdrop) {
                closeAddTaskModal();
            }
        });

        taskInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                addTask();
            }
        });

        priorityBtn.addEventListener("click", async () => {
            if (!selectedTask) return;

            await updateDoc(doc(db, "tasks", selectedTask.id), {
                priority: !selectedTask.priority,
                updatedAt: serverTimestamp()
            });

            closeModal();
        });

        fedeBtn.addEventListener("click", async () => {
            if (!selectedTask) return;

            await updateDoc(doc(db, "tasks", selectedTask.id), {
                completedBy: "fede",
                completedAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            });

            closeModal();
        });

        maruBtn.addEventListener("click", async () => {
            if (!selectedTask) return;

            await updateDoc(doc(db, "tasks", selectedTask.id), {
                completedBy: "maru",
                completedAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            });

            closeModal();
        });

        diaria.addEventListener("click", async () => {
            if (!selectedTask || canonicalPageName(activeList) !== "Tareas") return;

            const isDaily = selectedTask.diaria ||
                selectedTask.type === "daily" ||
                selectedTask.type === "daily-template";

            await updateDoc(doc(db, "tasks", selectedTask.id), {
                diaria: !isDaily,
                type: isDaily ? "normal" : "daily",
                priority: isDaily ? Boolean(selectedTask.priority) : true,
                completedBy: null,
                completedAt: null,
                updatedAt: serverTimestamp()
            });

            closeModal();
        });

        uncompleteBtn.addEventListener("click", async () => {
            if (!selectedTask) return;

            await updateDoc(doc(db, "tasks", selectedTask.id), {
                completedBy: null,
                completedAt: null,
                updatedAt: serverTimestamp()
            });

            closeModal();
        });

        deleteBtn.addEventListener("click", async () => {
            if (!selectedTask) return;

            const ok = confirm(`¿Eliminar "${selectedTask.title}"?`);
            if (!ok) return;

            await deleteDoc(doc(db, "tasks", selectedTask.id));
            closeModal();
        });

        async function addTask() {
            const title = taskInput.value.trim();
            if (!title) return;

            const newTask = {
                title,
                priority: false,
                completedBy: null,
                tipoDeActividad: isPurchasePage() ? "Compras" : activeList,
                type: "normal",
                createdAt: serverTimestamp(),
                diaria: false,
                updatedAt: serverTimestamp()
            };

            if (isPurchasePage()) {
                newTask.grupoCompra = purchaseGroupSelect.value || null;
            }

            if (activeList === "Compras") {
                newTask.estadoCompra = "faltante";
            }

            await addDoc(tasksRef, newTask);

            taskInput.value = "";
            closeAddTaskModal();
        }

        function subscribeTasks() {
            const q = query(tasksRef, orderBy("createdAt", "desc"));

            onSnapshot(
                q,
                snapshot => {
                    tasks = snapshot.docs.map(item => ({
                        id: item.id,
                        ...item.data()
                    }));

                    purchaseGroups = [...new Set(
                        tasks.flatMap(task => {
                            if (isPurchaseGroupRecord(task)) {
                                return [purchaseGroupRecordName(task)];
                            }

                            if (task.tipoDeActividad === "Compras" && task.grupoCompra) {
                                return [String(task.grupoCompra).trim().toUpperCase()];
                            }

                            return [];
                        }).filter(name => name && name !== "TODO")
                    )];
                    renderPurchaseGroupOptions();

                    snapshot.docs.forEach(item => {
                        if (!item.data().tipoDeActividad) {
                            updateDoc(doc(db, "tasks", item.id), {
                                tipoDeActividad: "Tareas"
                            }).catch(error => {
                                console.error(
                                    "No se pudo actualizar la actividad de una tarea antigua:",
                                    error
                                );
                            });
                        }
                    });

                    connectionStatus.textContent = "● Sincronizado";
                    render();
                    reconcileDailyTasks();
                },
                error => {
                    console.error(error);
                    connectionStatus.textContent = "⚠ Error de conexión";
                }
            );
        }

        function subscribeLists() {
            const q = query(listsRef, orderBy("createdAt", "asc"));

            onSnapshot(
                q,
                snapshot => {
                    const customNames = snapshot.docs
                        .map(item => item.data().name)
                        .filter(name => typeof name === "string" && name.trim())
                        .map(name => name.trim());

                    const defaultNames = ["✅Tareas", "🛒Compras", "📋Listas", "💸Grandes", "👶🏻Joan", "⛰️Viajes", "➕Otros"];
                    const customUniqueNames = customNames.filter(name =>
                        !defaultNames.some(
                            defaultName => canonicalPageName(defaultName).toLocaleLowerCase() === name.toLocaleLowerCase()
                        )
                    );
                    listNames = [...defaultNames, ...new Set(customUniqueNames)];

                    if (!listNames.some(name => canonicalPageName(name) === activeList)) {
                        activeList = "Tareas";
                    }

                    renderListNav();
                    render();
                },
                error => {
                    console.error(error);
                    connectionStatus.textContent = "⚠ Error al cargar las listas";
                }
            );
        }

        async function reconcileDailyTasks() {
            if (!tasks.length) return;

            const today = argentinaDateKey();

            for (const task of tasks) {
                if (
                    task.type === "daily" &&
                    (task.tipoDeActividad || "Tareas") === "Tareas" &&
                    task.completedBy &&
                    task.completedAt?.toDate
                ) {
                    const completedDate = new Intl.DateTimeFormat("en-CA", {
                        timeZone: "America/Argentina/Buenos_Aires"
                    }).format(task.completedAt.toDate());

                    if (completedDate !== today) {
                        await updateDoc(doc(db, "tasks", task.id), {
                            completedBy: null,
                            completedAt: null,
                            updatedAt: serverTimestamp()
                        });
                    }
                }
            }

            for (const task of tasks) {
                if (
                    task.type === "normal" &&
                    (task.tipoDeActividad || "Tareas") === "Tareas" &&
                    task.completedBy &&
                    task.completedAt?.toDate
                ) {
                    const completedDate = new Intl.DateTimeFormat("en-CA", {
                        timeZone: "America/Argentina/Buenos_Aires"
                    }).format(task.completedAt.toDate());

                    if (completedDate !== today) {
                        await deleteDoc(doc(db, "tasks", task.id));
                    }
                }
            }
        }

        signInAnonymously(auth)
            .then(() => {
                connectionStatus.textContent = "● Conectando...";
            })
            .catch(error => {
                console.error(error);
                connectionStatus.textContent = "⚠ No se pudo autenticar";
            });

        onAuthStateChanged(auth, user => {
            if (!user) return;

            subscribeTasks();
            subscribeLists();

            setInterval(reconcileDailyTasks, 60 * 1000);
        });

        renderListNav();
        render();
    </script>
</body>

</html>
