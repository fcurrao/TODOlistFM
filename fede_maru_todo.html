<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fede & Maru — To Do</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --panel: #ffffff;
            --text: #18212b;
            --muted: #74808c;
            --border: #616060;
            --priority: #ffffff;
            --priority-border: #f0c75e;
            --fede: #dceeff;
            --fede-border: #4b9bea;
            --maru: #ffe0e0;
            --maru-border: #ef6a6a;
            --shadow: 0 10px 30px rgba(20, 30, 40, .08);
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .app {
            height: 100vh;
            display: flex;
            overflow: hidden;
            gap: 38px;
        }

        /* ============================================================
         SIDEBAR
         ============================================================ */

        .sidebar {
            width: 260px;
            height: 100vh;
            flex-shrink: 0;
            padding: 24px 18px;
            background: #111820;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .logo {
            font-size: 21px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .badgeBig {
            font-size: 20px;
            padding: 0;
            margin: 0;
            position: relative;
        }

        .subtitle {
            color: #9ca8b4;
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .task-composer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-input {
            width: 100%;
            border: 0;
            outline: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            background: #fff;
            color: #18212b;
            -webkit-appearance: none;
        }

        .add-btn {
            border: 0;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            font-weight: 700;
            background: #fff;
            color: #111820;
            transition: .15s;
        }

        .add-btn:hover {
            transform: translateY(-1px);
        }

        .status {
            margin-top: auto;
            font-size: 11px;
            color: #9ca8b4;
            line-height: 1.5;
        }

        .list-nav {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .list-nav button {
            width: 100%;
            border: 1px solid #44505c;
            border-radius: 9px;
            padding: 10px 12px;
            background: transparent;
            color: #d7dfe7;
            text-align: left;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .list-nav button.active {
            background: #fff;
            color: #111820;
            border-color: #fff;
        }

        .list-nav button.add-list-btn {
            border-style: dashed;
            color: #aeb9c4;
        }

        /* ============================================================
         CONTENT
         ============================================================ */

        .content {
            flex: 1;
            min-width: 0;
            height: 100vh;
            padding: 30px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .counter {
            color: var(--muted);
            font-size: 13px;
        }

        /* ============================================================
         TASKS
         ============================================================ */

        .tasks {
            display: flex;
            flex-direction: column;
            gap: 9px;
            max-width: 1000px;
            overflow-y: auto;
            min-height: 0;
            flex: 1;
        }

        .task {
            background: var(--panel);
            border: 2px solid var(--border);
            border-left: 5px solid;
            border-radius: 12px;
            padding: 12px 12px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(20, 30, 40, .03);
            transition: transform .12s, box-shadow .12s;
        }

        .task:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .task.priority {
            background: var(--priority);
            border-color: var(--priority-border);
            border-left-color: #e2a900;
        }

        .task.done-fede {
            background: var(--fede);
            border-color: var(--fede-border);
            border-left-color: #1877d2;
            opacity: .82;
        }

        .task.done-maru {
            background: var(--maru);
            border-color: var(--maru-border);
            border-left-color: #d83b3b;
            opacity: .82;
        }

        .task-main {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .task-title {
            flex: 1;
            font-size: 15px;
            font-weight: 600;
            word-break: break-word;
        }

        .badge {
            flex-shrink: 0;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .4px;
            border-radius: 999px;
            padding: 5px 8px;
            background: rgba(0, 0, 0, .06);
        }

        .empty {
            color: var(--muted);
            padding: 50px 10px;
            text-align: center;
        }

        /* ============================================================
         MODAL
         ============================================================ */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal {
            width: min(420px, 100%);
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .25);
        }

        .modal h2 {
            margin: 0 0 7px;
            font-size: 19px;
        }

        .modal-task {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 20px;
            word-break: break-word;
        }

        .modal-buttons {
            display: grid;
            gap: 9px;
        }

        .modal button {
            border: 1px solid var(--border);
            background: #f8f9fa;
            border-radius: 10px;
            padding: 13px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
        }

        .modal button:hover {
            background: #eef1f4;
        }

        .modal .priority-btn {
            background: #fff5d6;
            border-color: #efca63;
        }

        .modal .fede-btn {
            background: #e2f1ff;
            border-color: #77b4eb;
        }

        .modal .task-input {
            margin-top: 12px;
            border: 1px solid #cbd2d9;
            padding: 13px;
        }

        .modal .add-submit-btn {
            width: 100%;
            margin-top: 10px;
            background: #111820;
            border-color: #111820;
            color: #fff;
        }

        .task.done-fede .task-title,
        .task.done-maru .task-title {
            text-decoration: line-through;
        }

        .tasks-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0 4px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .tasks-divider::before,
        .tasks-divider::after {
            content: "";
            height: 1px;
            background: var(--border);
            flex: 1;
        }

        .modal .maru-btn {
            background: #ffe7e7;
            border-color: #ef8b8b;
        }

        .modal .delete-btn {
            color: #c62828;
            background: #fff;
            border-color: #efb0b0;
        }

        .close-btn {
            margin-top: 13px;
            width: 100%;
        }

        /* ============================================================
         MOBILE
         ============================================================ */

        @media (max-width: 800px) {

            html,
            body {
                width: 100%;
                height: 100%;
                min-height: 100dvh;
                overflow: hidden;
            }

            .app {
                width: 100%;
                height: 100dvh;
                min-height: 100dvh;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                gap: 0;
            }

            .content {
                order: 1;
                width: 100%;
                height: calc(100dvh - 220px);
                min-height: 0;
                padding: 12px 16px 8px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                flex: none;
            }

            .content-header {
                flex-shrink: 0;
                margin: 0 0 10px 0;
                border-bottom: 3px solid var(--border);
            }

            h1 {
                margin: 0;
                font-size: 22px;
                line-height: 1.2;
            }

            .counter {
                margin-top: 2px;
                margin-bottom: 2px;
                font-size: 12px;
            }

            .tasks {
                width: 100%;
                max-width: none;
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                overflow-x: hidden;
                display: flex;
                flex-direction: column;
                gap: 7px;
                padding-bottom: 4px;
                -webkit-overflow-scrolling: touch;
            }

            .task {
                flex-shrink: 0;
                padding: 12px 12px;
                border-radius: 10px;
            }

            .task-main {
                gap: 7px;
            }

            .task-title {
                font-size: 14px;
                line-height: 1.3;
            }

            .badge {
                font-size: 9px;
                padding: 4px 7px;
            }

            .badgeBig {
                font-size: 18px;
            }

            .empty {
                padding: 30px 10px;
            }

            .sidebar {
                order: 2;
                position: static;
                width: 100%;
                height: 220px;
                min-width: 0;
                min-height: 220px;
                flex-shrink: 0;
                padding: 12px 16px;
                gap: 5px;
            }

            .list-nav {
                flex-direction: row;
                flex-shrink: 0;
                overflow-x: auto;
                padding-bottom: 2px;
                -webkit-overflow-scrolling: touch;
            }

            .list-nav button {
                width: auto;
                background-color: #a70a4b;
                flex-shrink: 0;
                padding: 9px 12px;
            }

            .task-composer {
                margin-top: 0;
                gap: 7px;
            }

            .task-input {
                height: 60px;
                padding: 18px;
                font-size: 16px;
            }

            .add-btn {
                padding: 18px;
            }

            .status {
                margin-top: 2px;
                font-size: 10px;
                line-height: 1.2;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <aside class="sidebar" style="margin-top: 36px; ">


            <div class="task-composer">
                <button id="addBtn" class="add-btn">+ Agregar a Tareas</button>
            </div>

            <div class="status">
                <div id="connectionStatus">Conectando...</div>
                <div>En Tareas, las diarias se regeneran a la 01:00.</div>
                <div>En Tareas, las realizadas se eliminan a las 00:00.</div>
            </div>
            <nav id="listNav" class="list-nav" style="margin-top: 5px; height: 60px;" aria-label="Listas"></nav>
        </aside>

        <main class="content">
            <div class="content-header">
                <div>
                    <h1 id="pageTitle">Tareas ✓ Fede & Maru</h1>
                    <div id="counter" class="counter"></div>
                </div>
            </div>

            <section id="tasks" class="tasks"></section>
        </main>
    </div>

    <div id="modalBackdrop" class="modal-backdrop">
        <div class="modal">
            <h2>¿Qué hacemos con este elemento?</h2>
            <div id="modalTask" class="modal-task"></div>

            <div class="modal-buttons">
                <button id="priorityBtn" class="priority-btn"></button>
                <button id="fedeBtn" class="fede-btn">La realizó Fede</button>
                <button id="maruBtn" class="maru-btn">La realizó Maru</button>
                <button id="uncompleteBtn">Marcar como pendiente</button>
                <button id="diaria">Marcar como diaria</button>
                <button id="deleteBtn" class="delete-btn">Eliminar elemento</button>
            </div>

            <button id="closeBtn" class="close-btn">Cerrar</button>
        </div>
    </div>

    <div id="addTaskBackdrop" class="modal-backdrop">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
            <h2 id="addModalTitle">Agregar elemento a Tareas</h2>
            <input id="taskInput" class="task-input" type="text" maxlength="200" placeholder="Escribí el elemento..."
                autocomplete="off" />
            <button id="modalAddBtn" class="add-submit-btn" style="margin-right: 8px; padding:20px"
                type="button">Agregar</button>
            <button id="closeAddModalBtn" class="close-btn" style="background-color:#f44336"
                type="button">Cancelar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getAuth,
            signInAnonymously,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        import {
            getFirestore,
            collection,
            addDoc,
            updateDoc,
            deleteDoc,
            doc,
            query,
            orderBy,
            onSnapshot,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHGZQycg39iiG0pe83uOIKFe4SdWiJsdk",
            authDomain: "todolist-42ba3.firebaseapp.com",
            databaseURL: "https://todolist-42ba3-default-rtdb.firebaseio.com",
            projectId: "todolist-42ba3",
            storageBucket: "todolist-42ba3.firebasestorage.app",
            messagingSenderId: "530049953408",
            appId: "1:530049953408:web:37aa3d609c3502a4948065"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const tasksRef = collection(db, "tasks");
        const listsRef = collection(db, "taskLists");

        let tasks = [];
        let listNames = ["Tareas", "Compras", "Grandes", "Joan", "Viajes", "Otros"];
        let activeList = "Tareas";
        let selectedTask = null;

        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const tasksEl = document.getElementById("tasks");
        const counterEl = document.getElementById("counter");
        const connectionStatus = document.getElementById("connectionStatus");
        const listNav = document.getElementById("listNav");
        const pageTitle = document.getElementById("pageTitle");

        const modalBackdrop = document.getElementById("modalBackdrop");
        const modalTask = document.getElementById("modalTask");
        const addTaskBackdrop = document.getElementById("addTaskBackdrop");
        const addModalTitle = document.getElementById("addModalTitle");
        const modalAddBtn = document.getElementById("modalAddBtn");
        const closeAddModalBtn = document.getElementById("closeAddModalBtn");
        const priorityBtn = document.getElementById("priorityBtn");
        const fedeBtn = document.getElementById("fedeBtn");
        const maruBtn = document.getElementById("maruBtn");
        const uncompleteBtn = document.getElementById("uncompleteBtn");
        const diaria = document.getElementById("diaria");
        const deleteBtn = document.getElementById("deleteBtn");
        const closeBtn = document.getElementById("closeBtn");

        function getArgentinaDateParts() {
            const parts = new Intl.DateTimeFormat("en-US", {
                timeZone: "America/Argentina/Buenos_Aires",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                hourCycle: "h23"
            }).formatToParts(new Date());

            const get = type => parts.find(p => p.type === type)?.value;

            return {
                year: Number(get("year")),
                month: Number(get("month")),
                day: Number(get("day")),
                hour: Number(get("hour"))
            };
        }

        function argentinaDateKey() {
            const d = getArgentinaDateParts();
            return `${d.year}-${String(d.month).padStart(2, "0")}-${String(d.day).padStart(2, "0")}`;
        }

        function sortTasks(list) {
            return [...list].sort((a, b) => {
                const aDone = Boolean(a.completedBy);
                const bDone = Boolean(b.completedBy);

                if (aDone !== bDone) {
                    return aDone ? 1 : -1;
                }

                if (Boolean(a.priority) !== Boolean(b.priority)) {
                    return a.priority ? -1 : 1;
                }

                const aTime = a.createdAt?.seconds || 0;
                const bTime = b.createdAt?.seconds || 0;

                return bTime - aTime;
            });
        }

        function render() {
            const pageTasks = tasks.filter(
                task => (task.tipoDeActividad || "Tareas") === activeList
            );
            const sorted = sortTasks(pageTasks);
            const pendingCount = sorted.filter(task => !task.completedBy).length;

            counterEl.textContent = `${pendingCount} elementos por hacer`;
            tasksEl.innerHTML = "";
            pageTitle.textContent = `${activeList} ✓ `;
            addBtn.textContent = `+ Agregar a ${activeList}`;
            addModalTitle.textContent = `Agregar elemento a ${activeList}`;

            if (!sorted.length) {
                tasksEl.innerHTML = `
                    <div class="empty">
                        Esta lista está vacía. Agregá el primer elemento.
                    </div>
                `;
                return;
            }

            let previousDone = false;

            for (const task of sorted) {
                const isDone = Boolean(task.completedBy);

                if (isDone && !previousDone) {
                    const divider = document.createElement("div");
                    divider.className = "tasks-divider";
                    divider.textContent = "HECHAS";
                    tasksEl.appendChild(divider);
                }

                previousDone = isDone;

                const element = document.createElement("article");
                element.className = "task";

                if (task.priority && !task.completedBy) {
                    element.classList.add("priority");
                }

                if (task.completedBy === "fede") {
                    element.classList.add("done-fede");
                }

                if (task.completedBy === "maru") {
                    element.classList.add("done-maru");
                }

                let badge = "";
                let daily = "";
                let priority = "";
                let pending = "";

                if (task.diaria) {
                    daily = `<span class="badge">DIARIA</span>`;
                }

                if (task.completedBy === "fede") {
                    badge = `<span class="badge">Fede ✓</span>`;
                } else if (task.completedBy === "maru") {
                    badge = `<span class="badge">Maru ✓</span>`;
                }

                if (!task.completedBy) {
                    pending = `<span class="pending-icon">🔴</span>`;
                }

                if (task.priority) {
                    priority = `<span class="badgeBig">‼️</span>`;
                }

                element.innerHTML = `
                    <div class="task-main">
                        <div class="task-title">
                            ${pending}
                            <span class="task-text"></span>
                        </div>
                        ${daily}
                        ${badge}
                        ${priority}
                    </div>
                `;

                element.querySelector(".task-text").textContent = task.title;
                element.addEventListener("click", () => openModal(task));
                tasksEl.appendChild(element);
            }
        }

        function openModal(task) {
            selectedTask = task;
            modalTask.textContent = task.title;

            const isDaily = task.diaria ||
                task.type === "daily" ||
                task.type === "daily-template";

            priorityBtn.textContent = task.priority
                ? "Quitar prioridad"
                : "Marcar como prioridad";

            deleteBtn.style.display = isDaily ? "none" : "block";
            diaria.style.display =
                activeList !== "Tareas" || isDaily ? "none" : "block";
            priorityBtn.style.display = isDaily ? "none" : "block";

            modalBackdrop.classList.add("open");
        }

        function closeModal() {
            selectedTask = null;
            modalBackdrop.classList.remove("open");
        }

        function renderListNav() {
            listNav.innerHTML = "";

            for (const name of listNames) {
                const button = document.createElement("button");
                button.type = "button";
                button.textContent = name;
                button.classList.toggle("active", name === activeList);
                button.setAttribute(
                    "aria-current",
                    name === activeList ? "page" : "false"
                );

                button.addEventListener("click", () => {
                    activeList = name;
                    renderListNav();
                    render();
                });

                listNav.appendChild(button);
            }

            const addListButton = document.createElement("button");
            addListButton.type = "button";
            addListButton.className = "add-list-btn";
            addListButton.textContent = "+ Nueva lista";
            addListButton.addEventListener("click", createList);
            listNav.appendChild(addListButton);
        }

        function openAddTaskModal() {
            addTaskBackdrop.classList.add("open");
            taskInput.value = "";
            taskInput.focus();
        }

        function closeAddTaskModal() {
            addTaskBackdrop.classList.remove("open");
        }

        async function createList() {
            const name = prompt("Nombre de la nueva lista (por ejemplo, Viajes):")?.trim();

            if (!name) return;

            if (name.length > 40) {
                alert("El nombre de la lista no puede superar los 40 caracteres.");
                return;
            }

            const existing = listNames.find(
                item => item.toLocaleLowerCase() === name.toLocaleLowerCase()
            );

            if (existing) {
                activeList = existing;
                renderListNav();
                render();
                return;
            }

            try {
                await addDoc(listsRef, {
                    name,
                    createdAt: serverTimestamp()
                });

                activeList = name;
            } catch (error) {
                console.error(error);
                alert("No se pudo crear la lista. Revisá la conexión.");
            }
        }

        closeBtn.addEventListener("click", closeModal);

        modalBackdrop.addEventListener("click", event => {
            if (event.target === modalBackdrop) {
                closeModal();
            }
        });

        addBtn.addEventListener("click", openAddTaskModal);
        modalAddBtn.addEventListener("click", addTask);
        closeAddModalBtn.addEventListener("click", closeAddTaskModal);

        addTaskBackdrop.addEventListener("click", event => {
            if (event.target === addTaskBackdrop) {
                closeAddTaskModal();
            }
        });

        taskInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                addTask();
            }
        });

        priorityBtn.addEventListener("click", async () => {
            if (!selectedTask) return;

            await updateDoc(doc(db, "tasks", selectedTask.id), {
                priority: !selectedTask.priority,
                updatedAt: serverTimestamp()
            });

            closeModal();
        });

        fedeBtn.addEventListener("click", async () => {
            if (!selectedTask) return;

            await updateDoc(doc(db, "tasks", selectedTask.id), {
                completedBy: "fede",
                completedAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            });

            closeModal();
        });

        maruBtn.addEventListener("click", async () => {
            if (!selectedTask) return;

            await updateDoc(doc(db, "tasks", selectedTask.id), {
                completedBy: "maru",
                completedAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            });

            closeModal();
        });

        diaria.addEventListener("click", async () => {
            if (!selectedTask || activeList !== "Tareas") return;

            await updateDoc(doc(db, "tasks", selectedTask.id), {
                diaria: true,
                type: "daily",
                priority: true,
                completedBy: null,
                completedAt: null,
                updatedAt: serverTimestamp()
            });

            closeModal();
        });

        uncompleteBtn.addEventListener("click", async () => {
            if (!selectedTask) return;

            await updateDoc(doc(db, "tasks", selectedTask.id), {
                completedBy: null,
                completedAt: null,
                updatedAt: serverTimestamp()
            });

            closeModal();
        });

        deleteBtn.addEventListener("click", async () => {
            if (!selectedTask) return;

            if (
                selectedTask.diaria ||
                selectedTask.type === "daily" ||
                selectedTask.type === "daily-template"
            ) {
                return;
            }

            const ok = confirm(`¿Eliminar "${selectedTask.title}"?`);
            if (!ok) return;

            await deleteDoc(doc(db, "tasks", selectedTask.id));
            closeModal();
        });

        async function addTask() {
            const title = taskInput.value.trim();
            if (!title) return;

            await addDoc(tasksRef, {
                title,
                priority: false,
                completedBy: null,
                tipoDeActividad: activeList,
                type: "normal",
                createdAt: serverTimestamp(),
                diaria: false,
                updatedAt: serverTimestamp()
            });

            taskInput.value = "";
            closeAddTaskModal();
        }

        function subscribeTasks() {
            const q = query(tasksRef, orderBy("createdAt", "desc"));

            onSnapshot(
                q,
                snapshot => {
                    tasks = snapshot.docs.map(item => ({
                        id: item.id,
                        ...item.data()
                    }));

                    snapshot.docs.forEach(item => {
                        if (!item.data().tipoDeActividad) {
                            updateDoc(doc(db, "tasks", item.id), {
                                tipoDeActividad: "Tareas"
                            }).catch(error => {
                                console.error(
                                    "No se pudo actualizar la actividad de una tarea antigua:",
                                    error
                                );
                            });
                        }
                    });

                    connectionStatus.textContent = "● Sincronizado";
                    render();
                    reconcileDailyTasks();
                },
                error => {
                    console.error(error);
                    connectionStatus.textContent = "⚠ Error de conexión";
                }
            );
        }

        function subscribeLists() {
            const q = query(listsRef, orderBy("createdAt", "asc"));

            onSnapshot(
                q,
                snapshot => {
                    const customNames = snapshot.docs
                        .map(item => item.data().name)
                        .filter(name => typeof name === "string" && name.trim())
                        .map(name => name.trim());

                    const defaultNames = ["Tareas", "Compras", "Grandes", "Joan", "Viajes", "Otros"];
                    const customUniqueNames = customNames.filter(name =>
                        !defaultNames.some(
                            defaultName => defaultName.toLocaleLowerCase() === name.toLocaleLowerCase()
                        )
                    );
                    listNames = [...defaultNames, ...new Set(customUniqueNames)];

                    if (!listNames.includes(activeList)) {
                        activeList = "Tareas";
                    }

                    renderListNav();
                    render();
                },
                error => {
                    console.error(error);
                    connectionStatus.textContent = "⚠ Error al cargar las listas";
                }
            );
        }

        async function reconcileDailyTasks() {
            if (!tasks.length) return;

            const today = argentinaDateKey();

            for (const task of tasks) {
                if (
                    task.type === "daily" &&
                    (task.tipoDeActividad || "Tareas") === "Tareas" &&
                    task.completedBy &&
                    task.completedAt?.toDate
                ) {
                    const completedDate = new Intl.DateTimeFormat("en-CA", {
                        timeZone: "America/Argentina/Buenos_Aires"
                    }).format(task.completedAt.toDate());

                    if (completedDate !== today) {
                        await updateDoc(doc(db, "tasks", task.id), {
                            completedBy: null,
                            completedAt: null,
                            updatedAt: serverTimestamp()
                        });
                    }
                }
            }

            for (const task of tasks) {
                if (
                    task.type === "normal" &&
                    (task.tipoDeActividad || "Tareas") === "Tareas" &&
                    task.completedBy &&
                    task.completedAt?.toDate
                ) {
                    const completedDate = new Intl.DateTimeFormat("en-CA", {
                        timeZone: "America/Argentina/Buenos_Aires"
                    }).format(task.completedAt.toDate());

                    if (completedDate !== today) {
                        await deleteDoc(doc(db, "tasks", task.id));
                    }
                }
            }
        }

        signInAnonymously(auth)
            .then(() => {
                connectionStatus.textContent = "● Conectando...";
            })
            .catch(error => {
                console.error(error);
                connectionStatus.textContent = "⚠ No se pudo autenticar";
            });

        onAuthStateChanged(auth, user => {
            if (!user) return;

            subscribeTasks();
            subscribeLists();

            setInterval(reconcileDailyTasks, 60 * 1000);
        });

        renderListNav();
        render();
    </script>
</body>

</html>
